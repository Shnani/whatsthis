<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
		<title>这是什么？</title>
		<style>
			:root {
				/* 不透明：一旦留了 alpha，就会去采样窗口背后的内容，正是伪影的来源 */
				--bg: #1e1e21;
				--line: rgba(255, 255, 255, 0.1);
				--fg: #f2f2f7;
				--muted: rgba(235, 235, 245, 0.6);
				--danger: #ff6b6b;
				--accent: #4a9eff;
				--code-bg: rgba(255, 255, 255, 0.08);
			}
			@media (prefers-color-scheme: light) {
				:root {
					--bg: #f7f7f7;
					--line: rgba(0, 0, 0, 0.1);
					--fg: #1c1c1e;
					--muted: rgba(60, 60, 67, 0.6);
					--danger: #d70015;
					--accent: #0a6fdb;
					--code-bg: rgba(0, 0, 0, 0.055);
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: transparent;
				overflow: hidden;
			}
			body {
				font: 13px/1.55 -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
				color: var(--fg);
				-webkit-font-smoothing: antialiased;
			}
			.panel {
				display: flex;
				flex-direction: column;
				height: 100%;
				margin: 6px;
				border-radius: 12px;
				background: var(--bg);
				border: 1px solid var(--line);
				overflow: hidden;
				/* 不要在这里加 box-shadow：6px 边距放不下 32px 的模糊，会被窗口边缘硬切出直线。
				   阴影交给 macOS 画（BrowserWindow 的 hasShadow），随窗口形状走，不会被裁。 */
			}
			header {
				display: flex;
				align-items: center;
				gap: 4px;
				padding: 10px 10px;
				border-bottom: 1px solid var(--line);
				flex: none;
			}
			header .title {
				font-weight: 600;
				/* 按钮多了以后这里最容易被挤到换行，钉死不让它换 */
				flex: none;
				white-space: nowrap;
			}
			header .source,
			header .model {
				font-size: 11px;
				color: var(--muted);
				border: 1px solid var(--line);
				border-radius: 5px;
				padding: 1px 6px;
				/* min-width 不归零的话，flex 不会让它们缩到内容宽度以下，窄了就把标题挤出去 */
				min-width: 0;
				max-width: 110px;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			/* 标签短又有用，不给它缩；位置不够时先截模型名 */
			header .source {
				flex: none;
			}
			header .source:empty,
			header .model:empty {
				display: none;
			}
			header .spacer {
				flex: 1;
			}
			/* 把「对卡片的操作」和「信息」「翻页」分开，免得图标挤成一团分不清 */
			header .sep {
				width: 1px;
				height: 14px;
				background: var(--line);
			}
			header button svg {
				display: block;
				width: 13px;
				height: 13px;
			}
			/* 复制成功后把图标换成对勾，见 script 里的 copied */
			header button .ok,
			header button.copied .icon {
				display: none;
			}
			header button.copied .ok {
				display: block;
			}
			header button.copied {
				color: var(--accent);
			}
			header .page {
				font-size: 11px;
				color: var(--muted);
				font-variant-numeric: tabular-nums;
			}
			header .page:empty {
				display: none;
			}
			header button {
				all: unset;
				cursor: pointer;
				color: var(--muted);
				font-size: 14px;
				line-height: 1;
				padding: 2px 3px;
				border-radius: 5px;
			}
			header button:hover {
				color: var(--fg);
				background: var(--line);
			}
			header button:disabled {
				opacity: 0.3;
				cursor: default;
			}
			header button:disabled:hover {
				color: var(--muted);
				background: none;
			}
			main {
				flex: 1;
				display: flex;
				flex-direction: column;
				gap: 10px;
				padding: 12px;
				overflow-y: auto;
			}
			/* 内容框本身就是「发送」按钮：点菜单栏图标只把内容摆出来，点它才发给模型 */
			.preview {
				flex: none;
				display: flex;
				flex-direction: column;
				gap: 8px;
				width: 100%;
				margin: 0;
				background: none;
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 8px 10px;
				color: var(--muted);
				font: inherit;
				text-align: left;
				max-height: 140px;
				overflow: hidden;
			}
			.preview-body {
				font-size: 12px;
				white-space: pre-wrap;
				word-break: break-word;
			}
			.preview.image .preview-body {
				display: flex;
				justify-content: center;
			}
			.preview.image .preview-body img {
				max-width: 100%;
				max-height: 110px;
				border-radius: 8px;
				border: 1px solid var(--line);
				object-fit: contain;
			}
			.preview .send {
				display: none;
			}
			/* 待发送：整块可点，给足提示 */
			.preview.pending {
				cursor: pointer;
				border-color: var(--accent);
			}
			.preview.pending:hover {
				background: var(--code-bg);
			}
			.preview.pending .send {
				display: block;
				font-size: 11px;
				color: var(--accent);
			}
			#answer {
				flex: 1;
				word-break: break-word;
			}
			/* 「思考中…」只在真的在生成时显示；待发送的卡片下面留空 */
			#answer.cursor:empty::after {
				content: "思考中…";
				color: var(--muted);
			}
			/* 搜索期间换句话，免得静默 1-3 秒看着像卡住 */
			#answer.cursor.searching:empty::after {
				content: "正在搜索网络…";
			}
			#answer.error {
				color: var(--danger);
				white-space: pre-wrap;
			}
			#answer.empty {
				color: var(--muted);
			}

			/* Markdown 渲染出来的元素 */
			#answer > :first-child {
				margin-top: 0;
			}
			#answer > :last-child {
				margin-bottom: 0;
			}
			#answer p,
			#answer ul,
			#answer ol,
			#answer pre,
			#answer blockquote,
			#answer table {
				margin: 0 0 10px;
			}
			#answer h1,
			#answer h2,
			#answer h3,
			#answer h4 {
				margin: 14px 0 8px;
				line-height: 1.35;
			}
			#answer h1 {
				font-size: 17px;
			}
			#answer h2 {
				font-size: 15px;
			}
			#answer h3,
			#answer h4 {
				font-size: 13.5px;
			}
			#answer ul,
			#answer ol {
				padding-left: 20px;
			}
			#answer li {
				margin: 3px 0;
			}
			#answer code {
				font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
				background: var(--code-bg);
				border-radius: 4px;
				padding: 1px 4px;
			}
			#answer pre {
				background: var(--code-bg);
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 8px 10px;
				overflow-x: auto;
			}
			#answer pre code {
				display: block;
				background: none;
				padding: 0;
				white-space: pre;
			}
			#answer a {
				color: var(--accent);
				text-decoration: none;
				cursor: pointer;
			}
			#answer a:hover {
				text-decoration: underline;
			}
			#answer blockquote {
				border-left: 3px solid var(--line);
				padding-left: 10px;
				color: var(--muted);
			}
			#answer table {
				border-collapse: collapse;
				font-size: 12px;
			}
			#answer th,
			#answer td {
				border: 1px solid var(--line);
				padding: 4px 8px;
				text-align: left;
			}
			#answer hr {
				border: none;
				border-top: 1px solid var(--line);
				margin: 12px 0;
			}
			.cursor::after {
				content: "▌";
				color: var(--muted);
				animation: blink 1s steps(2, start) infinite;
			}
			@keyframes blink {
				to {
					visibility: hidden;
				}
			}
		</style>
	</head>
	<body>
		<div class="panel">
			<header>
				<span class="title">这是什么？</span>
				<span class="source" id="source"></span>
				<span class="model" id="model"></span>
				<span class="spacer"></span>
				<span class="sep"></span>
				<button id="remove" title="删除这条">
					<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M3 6h18" />
						<path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
						<path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
					</svg>
				</button>
				<button id="copy" title="复制问题与回答全文">
					<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
						<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
					</svg>
					<svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M20 6 9 17l-5-5" />
					</svg>
				</button>
				<span class="sep"></span>
				<button id="prev" title="上一条">‹</button>
				<span class="page" id="page"></span>
				<button id="next" title="下一条">›</button>
				<button id="close" title="关闭（Esc）">✕</button>
			</header>
			<main>
				<button class="preview" id="preview" hidden>
					<span class="preview-body" id="previewBody"></span>
					<span class="send">点这里发送给 AI</span>
				</button>
				<div id="answer"></div>
			</main>
		</div>
		<script>
			const api = window.whatsthis;
			if (!api) {
				document.getElementById("answer").textContent =
					"这个页面要在 What's This? 应用里打开（点菜单栏图标）。在浏览器里直接打开不会加载 preload 脚本。";
				throw new Error("window.whatsthis 不存在：页面没有跑在 Electron 里");
			}
			const $model = document.getElementById("model");
			const $source = document.getElementById("source");
			const $page = document.getElementById("page");
			const $preview = document.getElementById("preview");
			const $previewBody = document.getElementById("previewBody");
			const $answer = document.getElementById("answer");
			const $main = document.querySelector("main");
			const $prev = document.getElementById("prev");
			const $next = document.getElementById("next");
			const $remove = document.getElementById("remove");
			const $copy = document.getElementById("copy");
			const $close = document.getElementById("close");

			const SOURCE_LABEL = {
				selection: "选中文字",
				followup: "追问",
				text: "剪切板文字",
				image: "剪切板图片",
			};

			/** 当前显示的是哪条记录，流式片段靠它对号入座 */
			let shownId = 0;

			$close.addEventListener("click", () => api.closePanel());
			$prev.addEventListener("click", () => api.page(-1));
			$next.addEventListener("click", () => api.page(1));
			$remove.addEventListener("click", () => api.remove());
			$preview.addEventListener("click", () => api.send());
			$copy.addEventListener("click", () => {
				api.copy();
				// 复制没有可见结果，把图标换成对勾给个回执
				$copy.classList.add("copied");
				setTimeout(() => $copy.classList.remove("copied"), 1200);
			});
			document.addEventListener("keydown", (e) => {
				if (e.key === "Escape") api.closePanel();
			});

			/** 没有卡片可显示：清掉标题栏，三个操作按钮都置灰。 */
			function clearHeader() {
				shownId = 0;
				$model.textContent = "";
				$source.textContent = "";
				$page.textContent = "";
				$prev.disabled = true;
				$next.disabled = true;
				$remove.disabled = true;
				$copy.disabled = true;
			}

			/** 没卡片时给一句话顶上。 */
			function showMessage(text, isError) {
				clearHeader();
				// 只清内容，别把按钮自己的 .preview-body / .send 也一起清掉
				$preview.className = "preview";
				$previewBody.replaceChildren();
				$preview.disabled = true;
				$preview.hidden = true;
				$answer.classList.remove("cursor");
				$answer.classList.toggle("error", isError);
				$answer.classList.toggle("empty", !isError);
				$answer.textContent = text;
			}

			/** 整条切换：新的提问、翻页、删除后的补位、收尾都是走这里。 */
			api.onEntry((entry) => {
				if (!entry) {
					showMessage("没有记录了，点菜单栏图标再问一次。", false);
					return;
				}
				// 收尾时主进程会把同一条重发一次，那次别把读完滚到底的页面拽回顶部
				const sameEntry = entry.id === shownId;
				shownId = entry.id;
				$model.textContent = entry.model || "";
				$source.textContent = SOURCE_LABEL[entry.kind] || "";
				$page.textContent = entry.total > 1 ? `${entry.index}/${entry.total}` : "";
				$prev.disabled = entry.index <= 1;
				$next.disabled = entry.index >= entry.total;
				$remove.disabled = false;
				$copy.disabled = false;

				// 待发送的卡片整块可点，点了才真的发给模型
				const canSend = entry.status === "pending";
				$preview.className = "preview";
				$previewBody.replaceChildren();
				$preview.hidden = true;
				if (entry.kind === "image" && entry.dataUrl) {
					const img = document.createElement("img");
					img.src = entry.dataUrl;
					$previewBody.appendChild(img);
					$preview.className = "preview image";
					$preview.hidden = false;
				} else if (entry.text) {
					$previewBody.textContent = entry.text;
					$preview.hidden = false;
				}
				$preview.classList.toggle("pending", canSend);
				$preview.disabled = !canSend;

				$answer.classList.remove("empty");
				$answer.classList.toggle("error", Boolean(entry.error));
				$answer.classList.toggle("cursor", entry.status === "running");
				$answer.classList.toggle("searching", Boolean(entry.searching));
				$answer.innerHTML = entry.error ? "" : entry.html;
				if (entry.error) $answer.textContent = entry.error;
				if (!sameEntry) $main.scrollTop = 0;
			});

			// 主进程已经把 Markdown 渲染成 HTML 了（顺带做了转义和链接过滤）
			api.onHtml((chunk) => {
				if (chunk.id !== shownId) return; // 翻页翻走了，别动页面
				// 用户往上翻看历史时别把他拽回底部
				const stick = $main.scrollTop + $main.clientHeight >= $main.scrollHeight - 32;
				$answer.innerHTML = chunk.html;
				if (stick) $main.scrollTop = $main.scrollHeight;
			});

			/** 没东西可问之类的一次性提示，不进历史，也不影响翻页。 */
			api.onNotice((message) => {
				showMessage(message, true);
			});

			// 链接一律交给系统浏览器，绝不让浮窗自己被导航走
			$answer.addEventListener("click", (event) => {
				const link = event.target.closest("a");
				if (!link) return;
				event.preventDefault();
				api.openExternal(link.getAttribute("href"));
			});
		</script>
	</body>
</html>
